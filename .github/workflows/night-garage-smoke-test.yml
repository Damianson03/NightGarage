name: Night Garage v0.2.3 - Variant Type Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/night-garage-smoke-test.yml'
      - 'game/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: '4.6.2'
      GODOT_STATUS: 'stable'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.2.3 strict typing hotfix
        shell: bash
        run: |
          test -f game/scripts/main.gd
          test -f game/scripts/game_state.gd
          test -f game/project.godot
          test -f game/export_presets.cfg
          test -f game/android/nightgarage-debug.keystore

          python3 <<'PY'
          from pathlib import Path

          main_path = Path("game/scripts/main.gd")
          main = main_path.read_text(encoding="utf-8")

          main = main.replace(
              "func _ready() -> void:\n    _build_world()\n    _build_ui()\n    _apply_screen()\n",
              "func _ready() -> void:\n    _build_ui()\n    _build_world()\n    _apply_screen()\n    _update_ui()\n",
          )

          main = main.replace(
              "    camera = Camera3D.new()\n    add_child(camera)\n",
              "    camera = Camera3D.new()\n    add_child(camera)\n    camera.current = true\n",
              1,
          )

          main = main.replace(
              "    moon.shadow_enabled = true\n",
              "    moon.shadow_enabled = false\n",
              1,
          )

          main = main.replace(
              "    var player_z := -state.player_distance\n",
              "    var player_z: float = -float(state.player_distance)\n",
          )

          main = main.replace(
              "        var cost := state.upgrade_cost(i)\n",
              "        var cost: int = int(state.upgrade_cost(i))\n",
          )

          main = main.replace(
              "    var t := clamp((value - edge0) / max(0.0001, edge1 - edge0), 0.0, 1.0)\n",
              "    var t: float = clampf((value - edge0) / maxf(0.0001, edge1 - edge0), 0.0, 1.0)\n",
          )

          main = main.replace(
              "str(max(1, int(ceil(min(state.countdown, 3.0)))))",
              "str(maxi(1, int(ceil(minf(float(state.countdown), 3.0)))))",
          )

          main_path.write_text(main, encoding="utf-8")

          state_path = Path("game/scripts/game_state.gd")
          state = state_path.read_text(encoding="utf-8")

          for old in ["v0.2.0", "v0.2.1", "v0.2.2"]:
              state = state.replace(
                  f'const GAME_VERSION := "{old}"',
                  'const GAME_VERSION := "v0.2.3"',
              )

          state = state.replace(
              "const GEAR_RATIOS := [3.77, 1.96, 1.28, 0.88, 0.67]",
              "const GEAR_RATIOS: Array[float] = [3.77, 1.96, 1.28, 0.88, 0.67]",
          )

          state = state.replace(
              "const UPGRADE_BASE_COST := [22000, 28000, 18000, 16000, 14000, 17000]",
              "const UPGRADE_BASE_COST: Array[int] = [22000, 28000, 18000, 16000, 14000, 17000]",
          )

          state = state.replace(
              "var upgrades := [0, 0, 0, 0, 0, 0]",
              "var upgrades: Array[int] = [0, 0, 0, 0, 0, 0]",
          )

          state = state.replace(
              "    var diff := abs(rpm - center)\n",
              "    var diff: float = absf(rpm - center)\n",
          )

          state = state.replace(
              "    return max(0.35, 0.60 - float(upgrades[2]) * 0.05)",
              "    return maxf(0.35, 0.60 - float(upgrades[2]) * 0.05)",
          )

          state = state.replace(
              "float(max(0, career_stage - 1))",
              "float(maxi(0, career_stage - 1))",
          )

          state = state.replace(
              "    var dt := min(delta, 0.05)",
              "    var dt: float = minf(delta, 0.05)",
          )

          state = state.replace(
              "    rpm = clamp(rpm, IDLE_RPM, REV_LIMIT_RPM + 140.0)",
              "    rpm = clampf(rpm, IDLE_RPM, REV_LIMIT_RPM + 140.0)",
          )

          state = state.replace(
              "    launch_quality = clamp(1.0 - diff / (half_width * 2.0), 0.0, 1.0)",
              "    launch_quality = clampf(1.0 - diff / (half_width * 2.0), 0.0, 1.0)",
          )

          state = state.replace(
              "            progress = clamp(1.0 - shift_timer / active_shift_duration, 0.0, 1.0)",
              "            progress = clampf(1.0 - shift_timer / active_shift_duration, 0.0, 1.0)",
          )

          state = state.replace(
              "        var target_rpm := max(IDLE_RPM, rpm_from_speed(speed_kmh, pending_gear))",
              "        var target_rpm: float = maxf(IDLE_RPM, rpm_from_speed(speed_kmh, pending_gear))",
          )

          state = state.replace(
              "            rpm = max(IDLE_RPM, rpm_from_speed(speed_kmh, gear))",
              "            rpm = maxf(IDLE_RPM, rpm_from_speed(speed_kmh, gear))",
          )

          state = state.replace(
              "            drive_force = min(drive_force, traction_limit)",
              "            drive_force = minf(drive_force, traction_limit)",
          )

          state = state.replace(
              "        var launch_fade := max(0.0, 1.0 - race_time / 2.2)",
              "        var launch_fade: float = maxf(0.0, 1.0 - race_time / 2.2)",
          )

          state = state.replace(
              "        drive_force *= max(0.70, 1.0 - launch_penalty * launch_fade)",
              "        drive_force *= maxf(0.70, 1.0 - launch_penalty * launch_fade)",
          )

          state = state.replace(
              "    speed_ms = max(0.0, speed_ms)",
              "    speed_ms = maxf(0.0, speed_ms)",
          )

          state = state.replace(
              "    max_speed_seen = max(max_speed_seen, speed_kmh)",
              "    max_speed_seen = maxf(max_speed_seen, speed_kmh)",
          )

          state = state.replace(
              "    var coupled_rpm := max(IDLE_RPM, rpm_from_speed(speed_kmh, gear))",
              "    var coupled_rpm: float = maxf(IDLE_RPM, rpm_from_speed(speed_kmh, gear))",
          )

          state = state.replace(
              "        var coupling := clamp(race_time / 0.90, 0.0, 1.0)",
              "        var coupling: float = clampf(race_time / 0.90, 0.0, 1.0)",
          )

          state = state.replace(
              "        return max(coupled_rpm, slipping_rpm)",
              "        return maxf(coupled_rpm, slipping_rpm)",
          )

          state = state.replace(
              "    var r := max(700.0, engine_rpm)",
              "    var r: float = maxf(700.0, engine_rpm)",
          )

          state = state.replace(
              "    var aero_fade := max(0.18, 1.0 - speed_ratio * speed_ratio * 0.82)",
              "    var aero_fade: float = maxf(0.18, 1.0 - speed_ratio * speed_ratio * 0.82)",
          )

          state = state.replace(
              "    opponent_speed_kmh = min(opponent_speed_kmh, opponent_max_speed)",
              "    opponent_speed_kmh = minf(opponent_speed_kmh, opponent_max_speed)",
          )

          state = state.replace(
              "    var level := upgrades[index]",
              "    var level: int = int(upgrades[index])",
          )

          state_path.write_text(state, encoding="utf-8")

          preset_path = Path("game/export_presets.cfg")
          preset = preset_path.read_text(encoding="utf-8")

          preset = preset.replace(
              'export_path="build/NightGarage-v0.2.0.apk"',
              'export_path="build/NightGarage-v0.2.3.apk"'
          )

          preset = preset.replace(
              'export_path="build/NightGarage-v0.2.1.apk"',
              'export_path="build/NightGarage-v0.2.3.apk"'
          )

          preset = preset.replace(
              'export_path="build/NightGarage-v0.2.2.apk"',
              'export_path="build/NightGarage-v0.2.3.apk"'
          )

          preset = preset.replace(
              'version/code=2',
              'version/code=3'
          )

          preset = preset.replace(
              'version/name="0.2.0"',
              'version/name="0.2.3"'
          )

          preset = preset.replace(
              'version/name="0.2.1"',
              'version/name="0.2.3"'
          )

          preset = preset.replace(
              'version/name="0.2.2"',
              'version/name="0.2.3"'
          )

          preset_path.write_text(preset, encoding="utf-8")
          PY

          echo "===== V0.2.3 CHECK ====="
          grep -n "GAME_VERSION" game/scripts/game_state.gd
          grep -n "var diff" game/scripts/game_state.gd
          grep -n "player_z" game/scripts/main.gd
          grep -n "version/name" game/export_presets.cfg

      - name: Commit v0.2.3 source
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            game/scripts/main.gd \
            game/scripts/game_state.gd \
            game/export_presets.cfg

          if git diff --cached --quiet; then
            echo "v0.2.3 source already present."
          else
            git commit -m "Fix strict GDScript typing in v0.2.3 [skip ci]"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

      - name: Download Godot
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -O /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"

          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot

          godot --version

      - name: Install Godot export templates
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" \
            -O /tmp/templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"

          mkdir -p "$TEMPLATE_DIR"
          rm -rf /tmp/templates_unpack
          mkdir -p /tmp/templates_unpack

          unzip -q /tmp/templates.tpz -d /tmp/templates_unpack
          cp -a /tmp/templates_unpack/templates/. "$TEMPLATE_DIR/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          KEYSTORE_PATH="$GITHUB_WORKSPACE/game/android/nightgarage-debug.keystore"
          test -f "$KEYSTORE_PATH"

          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "nightgaragedebug"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        shell: bash
        run: |
          godot \
            --headless \
            --path game \
            --editor \
            --quit \
            --verbose

      - name: Runtime smoke test
        shell: bash
        run: |
          set +e

          godot \
            --headless \
            --path game \
            --quit-after 8 \
            --verbose \
            2>&1 | tee /tmp/nightgarage-runtime.log

          GODOT_EXIT=${PIPESTATUS[0]}
          set -e

          if grep -Eiq \
            'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|Invalid set index|Cannot assign|Attempt to call|Warning treated as error' \
            /tmp/nightgarage-runtime.log; then

            echo "Runtime/script error detected:"

            grep -Ein \
              'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|Invalid set index|Cannot assign|Attempt to call|Warning treated as error' \
              /tmp/nightgarage-runtime.log

            exit 1
          fi

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Godot runtime smoke test exited with code $GODOT_EXIT"
            exit "$GODOT_EXIT"
          fi

          echo "Runtime smoke test passed."

      - name: Export Night Garage v0.2.3 APK
        shell: bash
        run: |
          mkdir -p game/build

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/game/android/nightgarage-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="nightgaragedebug"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          godot \
            --headless \
            --path game \
            --export-debug \
            "Android" \
            "build/NightGarage-v0.2.3.apk" \
            --verbose

          test -f game/build/NightGarage-v0.2.3.apk

          ls -lh game/build/NightGarage-v0.2.3.apk

      - name: Upload Night Garage v0.2.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: NightGarage-v0.2.3-GameplayBase
          path: game/build/NightGarage-v0.2.3.apk
          if-no-files-found: error
          retention-days: 14
