name: Night Garage v0.4.7 - Suspension Direction + Launch Lift

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/night-garage-smoke-test.yml'
      - 'NightGarage-v0.4.7-SuspensionDirectionLaunchLift-source.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: '4.6.2'
      GODOT_STATUS: 'stable'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Night Garage v0.4.7 source
        shell: bash
        run: |
          test -f NightGarage-v0.4.7-SuspensionDirectionLaunchLift-source.zip

          unzip -t NightGarage-v0.4.7-SuspensionDirectionLaunchLift-source.zip

          rm -rf game

          unzip -q \
            NightGarage-v0.4.7-SuspensionDirectionLaunchLift-source.zip \
            -d .

          test -f game/project.godot
          test -f game/main.tscn
          test -f game/export_presets.cfg
          test -f game/scripts/main.gd
          test -f game/scripts/game_state.gd
          test -f game/android/nightgarage-debug.keystore
          test -f game/assets/cars/2014_volkswagen_golf_gti_mk7.glb
          test -f game/assets/pbr/road_real/asphalt_02_diff_1k.jpg
          test -f game/assets/pbr/road_real/asphalt_02_nor_gl_1k.png
          test -f game/assets/pbr/road_real/asphalt_02_rough_1k.png
          test -f game/assets/pbr/road_real/asphalt_02_ao_1k.jpg

          echo "Night Garage v0.4.7 source installed correctly."

          grep -q 'GAME_VERSION := "v0.4.7"' game/scripts/game_state.gd
          grep -q 'asphalt_02_diff_1k.jpg' game/scripts/main.gd
          grep -q '_update_player_suspension' game/scripts/main.gd
          grep -q 'target_pitch_deg = clampf(-positive_accel' game/scripts/main.gd
          grep -q 'launch_green_low' game/scripts/main.gd
          grep -q 'version/name="0.4.7"' game/export_presets.cfg

          echo "v0.4.7 version, corrected suspension direction and launch lift verified."

      - name: Commit v0.4.7 source
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add game

          if git diff --cached --quiet; then
            echo "v0.4.7 source already matches repository."
          else
            git commit -m "Fix suspension direction and add launch lift v0.4.7 [skip ci]"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install Android packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

      - name: Download Godot
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -O /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"

          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot

          godot --version

      - name: Install Godot export templates
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" \
            -O /tmp/templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"

          mkdir -p "$TEMPLATE_DIR"
          rm -rf /tmp/templates_unpack
          mkdir -p /tmp/templates_unpack

          unzip -q /tmp/templates.tpz -d /tmp/templates_unpack
          cp -a /tmp/templates_unpack/templates/. "$TEMPLATE_DIR/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          KEYSTORE_PATH="$GITHUB_WORKSPACE/game/android/nightgarage-debug.keystore"

          test -f "$KEYSTORE_PATH"
          test -d "$ANDROID_HOME"

          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "nightgaragedebug"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project and assets
        shell: bash
        run: |
          godot \
            --headless \
            --path game \
            --editor \
            --quit \
            --verbose

      - name: Runtime smoke test
        shell: bash
        run: |
          set +e

          godot \
            --headless \
            --path game \
            --quit-after 8 \
            --verbose \
            2>&1 | tee /tmp/nightgarage-runtime.log

          GODOT_EXIT=${PIPESTATUS[0]}
          set -e

          if grep -Eiq \
            'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|Invalid set index|Cannot assign|Attempt to call|Warning treated as error' \
            /tmp/nightgarage-runtime.log; then

            echo "Runtime/script error detected:"

            grep -Ein \
              'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|Invalid set index|Cannot assign|Attempt to call|Warning treated as error' \
              /tmp/nightgarage-runtime.log

            exit 1
          fi

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Godot runtime smoke test exited with code $GODOT_EXIT"
            exit "$GODOT_EXIT"
          fi

          echo "Runtime smoke test passed."

      - name: Export Night Garage v0.4.7 APK
        shell: bash
        run: |
          mkdir -p game/build

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/game/android/nightgarage-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="nightgaragedebug"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          godot \
            --headless \
            --path game \
            --export-debug \
            "Android" \
            "build/NightGarage-v0.4.7.apk" \
            --verbose

          test -f game/build/NightGarage-v0.4.7.apk

          echo "Night Garage v0.4.7 APK created:"
          ls -lh game/build/NightGarage-v0.4.7.apk

      - name: Upload Night Garage v0.4.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: NightGarage-v0.4.7-SuspensionDirectionLaunchLift
          path: game/build/NightGarage-v0.4.7.apk
          if-no-files-found: error
          retention-days: 14
